name: Bug
description: Registrar un defecto reproducible
title: "[BUG] "
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 0.2.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options: [critical, high, medium, low]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos de reproducción
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Datos
      options:
        - label: He eliminado dominios privados, claves y datos sensibles.
          required: true
